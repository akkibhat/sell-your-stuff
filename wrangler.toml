name = "sell-your-stuff"
main = "src/worker.js"
compatibility_date = "2026-09-15"
workers_dev = true

# The Worker runs first so every page gets the security headers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Cloudflare creates this storage for you on the first deploy.
[[kv_namespaces]]
binding = "SALE_KV"
