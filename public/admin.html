<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sale admin</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<section id="loginView" class="login" hidden>
  <h1 class="brand"><img class="logo" src="/favicon.svg" alt="" width="40" height="40">Sign in</h1>
  <form id="loginForm">
    <label id="emailField" class="field" hidden><span>Email</span>
      <input id="email" type="email" autocomplete="username">
    </label>
    <label class="field"><span id="passwordLabel">Admin password</span>
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="loginError" class="error" role="alert"></p>
  </form>
  <p id="signupNote" class="muted" hidden>Got an invite? <a href="/signup">Sign up here</a>.</p>
</section>
<div id="appView" hidden>
  <header class="admin-header">
    <h1 class="brand"><img class="logo" src="/favicon.svg" alt="" width="40" height="40">Your sale</h1>
    <a id="saleLink" href="/" target="_blank" rel="noopener">View sale page</a>
    <button id="signOut" class="btn" type="button">Sign out</button>
  </header>
  <nav id="tabs" class="filters" aria-label="Admin sections"></nav>
  <p id="flash" class="flash" role="status" hidden></p>
  <main id="panel" class="panel"></main>
</div>
<dialog id="dialog" class="dialog"></dialog>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
